# Autonomous Mecanum Robot Configuration
# Raspberry Pi 5 + Raspberry Pi Pico

# UART Communication (Pi5 <-> Pico)
uart:
    port: /dev/ttyAMA3 # UART3 on Pi5 (protocol: STX/ETX + CRC-8)
    baudrate: 115200

# UART3 pins on Pi5
# GPIO8 (pin 24) = TX → GP1 (Pico RX)
# GPIO9 (pin 21) = RX ← GP0 (Pico TX)
# GND (pin 20) = GND

# Mecanum motor configuration
# Driver board: HW-249 (4x L9110S H-bridge), software PWM at 100 Hz
# (fixed in pi5/motors/motor_controller.py: PWM_HZ)
motors:
    # Wheel layout (top view)
    #   FL ──── FR
    #   │  ↑   │
    #   │ FRONT│
    #   RL ──── RR

    pins:
        # Front Left
        FL_in1: 17 # GPIO17 - forward
        FL_in2: 27 # GPIO27 - backward

        # Front Right
        FR_in1: 22 # GPIO22 - forward
        FR_in2: 23 # GPIO23 - backward

        # Rear Left
        RL_in1: 24 # GPIO24 - forward
        RL_in2: 25 # GPIO25 - backward

        # Rear Right
        RR_in1: 5 # GPIO5 - forward
        RR_in2: 6 # GPIO6 - backward

    # Speed correction per wheel, 0.5 to 1.0 (1.0 = none). Motors rarely spin at
    # the same rate for the same duty cycle. Slow down the faster side: if the
    # robot pivots right when driving straight (heading increases), the left
    # wheels are faster -> lower FL and RL, e.g. 0.95, and try again.
    trim:
        FL: 0.95
        FR: 1.0
        RL: 0.95
        RR: 1.0

# LiDAR RPLidar C1 (USB)
lidar:
    port: /dev/ttyUSB0
    baudrate: 460800
    min_quality: 10

# Autonomous navigation and patrol
navigation:
    waypoint_radius: 3.0 # meters - waypoint validation radius
    patrol_speed: 40 # % max speed during patrol
    obstacle_distance: 800 # mm - avoidance distance
    patrol_file: config/patrol_route.json
    loop: true # loop the patrol
    heading_offset_deg: 45.0 # added to BNO085 yaw (real heading = sensor + offset) - depends on physical mounting
    pid:
        kp: 1.0
        ki: 0.05
        kd: 0.1

# Authentication and TLS: see config/secrets.yaml
# (file ignored by git, copy secrets.yaml.example to get started)

# Web server (telemetry + control)
telemetry:
    web_server_port: 8085

# Sensors (on Pico) — informational only: the Pico runs MicroPython and
# cannot read this file, it always uses the constants hardcoded in
# pico/main.py. Keep these values in sync with pico/main.py by hand.
sensors:
    gps:
        type: neo_6m
        uart: 1 # Pico UART1
        baudrate: 115200
    imu:
        type: auto # auto-detected: BNO085 (0x4A) preferred, BMI160 (0x68) fallback
        i2c_bus: 1 # Pico I2C1
        address_bno085: 0x4A
        address_bmi160: 0x68
